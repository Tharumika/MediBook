<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>MediBook — Healthcare Appointments</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>
  <app-root>
    <div class="loading-screen">
      <div class="loading-container">
        <div class="logo-wrapper">
          <img src="assets/logo.png" alt="MediBook Logo" class="pulse-logo">
          <div class="glow-ring"></div>
        </div>
        <h1 class="brand-title">MediBook</h1>
        <p class="brand-subtitle">Connecting you to care</p>
        <div class="progress-bar">
          <div class="progress-fill"></div>
        </div>
      </div>
    </div>
    <style>
      body, html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #0f172a;
        font-family: 'Inter', sans-serif;
        overflow: hidden;
      }
      .loading-screen {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100vw;
        height: 100vh;
        background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
      }
      .loading-container {
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .logo-wrapper {
        position: relative;
        width: 96px;
        height: 96px;
        margin-bottom: 24px;
      }
      .pulse-logo {
        width: 100%;
        height: 100%;
        border-radius: 24px;
        object-fit: cover;
        box-shadow: 0 10px 25px rgba(15, 157, 140, 0.35);
        animation: pulse 2s infinite ease-in-out;
        z-index: 2;
        position: relative;
      }
      .glow-ring {
        position: absolute;
        top: -10px;
        left: -10px;
        right: -10px;
        bottom: -10px;
        border-radius: 30px;
        border: 2px solid rgba(15, 157, 140, 0.4);
        animation: ripple 2s infinite cubic-bezier(0.4, 0, 0.2, 1);
        z-index: 1;
        opacity: 0;
      }
      .brand-title {
        color: #ffffff;
        font-size: 28px;
        font-weight: 800;
        margin: 0 0 6px 0;
        letter-spacing: -0.5px;
        animation: fadeIn 0.8s ease-out;
      }
      .brand-subtitle {
        color: #94a3b8;
        font-size: 14px;
        font-weight: 500;
        margin: 0 0 32px 0;
        animation: fadeIn 1s ease-out;
      }
      .progress-bar {
        width: 160px;
        height: 4px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 99px;
        overflow: hidden;
        position: relative;
      }
      .progress-fill {
        width: 50%;
        height: 100%;
        background: linear-gradient(90deg, #0f9d8c, #38bdf8);
        border-radius: 99px;
        position: absolute;
        animation: loading-bar 1.5s infinite ease-in-out;
      }

      @keyframes pulse {
        0%, 100% {
          transform: scale(1);
          box-shadow: 0 10px 25px rgba(15, 157, 140, 0.35);
        }
        50% {
          transform: scale(1.05);
          box-shadow: 0 15px 35px rgba(15, 157, 140, 0.5);
        }
      }
      @keyframes ripple {
        0% {
          transform: scale(0.9);
          opacity: 0.8;
        }
        100% {
          transform: scale(1.3);
          opacity: 0;
        }
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes loading-bar {
        0% {
          left: -40%;
          width: 30%;
        }
        50% {
          width: 50%;
        }
        100% {
          left: 110%;
          width: 30%;
        }
      }
    </style>
  </app-root>
</body>
</html>
