# ===========================
# Application
# ===========================
spring.application.name=medibook
server.port=${PORT:8080}

# ===========================
# Database Configuration (H2 dev / MySQL prod)
# ===========================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:medibookdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===========================
# JPA / Hibernate
# ===========================
spring.jpa.database-platform=${SPRING_JPA_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:create-drop}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===========================
# JWT
# ===========================
medibook.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
medibook.jwt.expiration=86400000

# ===========================
# CORS
# ===========================
medibook.cors.allowed-origins=http://localhost:4200
